# OPC-OS (CreativeOS) CI：类型检查 + 全量测试
# 测试基线 362 项（node --test）；无 lint 脚本（dev-design 约定）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.19'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc strict)
        run: npm run build

      - name: Run full test suite
        run: npm test

      - name: Smoke — full pipeline demo (12 steps, real cordis)
        run: npm run demo
