<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPC-OS 控制台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 服务不可用时的整页横幅（app.js 探活失败时显示） -->
  <div id="health-banner" class="health-banner hidden" role="alert">无法连接 opcos-console 服务</div>

  <!-- 顶部导航栏：系统名 + 状态徽标 -->
  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1 3 9h4l-1 6 6-8H8z"/></svg>
      <div class="brand-text">
        <h1>OPC-OS 控制台</h1>
        <p>一人公司操作系统 · DSH 入口</p>
      </div>
    </div>
    <span id="status-badge" class="badge badge-muted">连接中…</span>
  </header>

  <!-- 左侧垂直导航 + 主区面板（hash 路由，刷新保持） -->
  <div class="layout">
    <nav class="sidenav" id="sidenav" aria-label="子系统导航">
      <a href="#/overview" data-route="overview">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
        <span>总览</span>
      </a>
      <a href="#/team" data-route="team">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="5.5" cy="5" r="2.2"/><path d="M1.8 13.5c.6-2.3 2-3.4 3.7-3.4s3.1 1.1 3.7 3.4"/><circle cx="11" cy="6" r="1.8"/><path d="M11 9.6c1.6 0 2.7 1 3.3 2.9"/></svg>
        <span>团队</span>
      </a>
      <a href="#/blackboard" data-route="blackboard">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="8.5" rx="1"/><path d="M4.5 5.5h5M4.5 8h7"/><path d="M8 11v2.2M5.5 14h5"/></svg>
        <span>黑板</span>
      </a>
      <a href="#/skills" data-route="skills">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8 13.5 4.5v7L8 14.2 2.5 11.5v-7z"/><path d="M2.5 4.5 8 7.3l5.5-2.8M8 7.3v6.9"/></svg>
        <span>Skill 市场</span>
      </a>
      <a href="#/orders" data-route="orders">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h8v12l-2-1.2L8 14l-2-1.2L4 14z"/><path d="M6 5.5h4M6 8h4"/></svg>
        <span>订单交易</span>
      </a>
      <a href="#/creators" data-route="creators">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="5.3" r="2.4"/><path d="M1.8 13.8c.7-2.7 2.3-4 4.2-4 1 0 1.9.4 2.6 1.1"/><circle cx="11.6" cy="11.4" r="2.6"/><path d="M11.6 10.3v2.2M10.5 11.4h2.2"/></svg>
        <span>创作者中心</span>
      </a>
      <a href="#/bills" data-route="bills">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2" width="11" height="12" rx="1.2"/><path d="M5 5.5h6M5 8h6M5 10.5h3.5"/></svg>
        <span>客户账单</span>
      </a>
      <a href="#/billing" data-route="billing">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6 4.6 8 7.3l2-2.7M8 7.3v4.3M6.2 8.6h3.6M6.2 10.4h3.6"/></svg>
        <span>RaaS 计费</span>
      </a>
      <a href="#/memory" data-route="memory">
        <svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="3.8" rx="5" ry="2"/><path d="M3 3.8v8.4c0 1.1 2.2 2 5 2s5-.9 5-2V3.8"/><path d="M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/></svg>
        <span>记忆库</span>
      </a>
    </nav>

    <main id="main" class="main"></main>
  </div>

  <!-- 底部运行时信息（/api/health：cordis 版本 / 已装载插件数） -->
  <footer class="footer" id="footer">运行时信息加载中…</footer>

  <!-- 全局 toast 容器 -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
