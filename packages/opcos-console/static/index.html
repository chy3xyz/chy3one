<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPC-OS 控制台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 服务不可用时的整页横幅（app.js 探活失败时显示） -->
  <div id="health-banner" class="health-banner hidden" role="alert">控制台暂时够不到后端——创意和收入数据都安全，恢复后自动续上</div>

  <!-- 外壳：左侧全高纯黑导航栏 + 右侧白色主列（hash 路由，刷新保持） -->
  <div class="layout">

    <!-- 纯黑侧栏：品牌 + 双视角分组导航 + 用户区（链接按 data-mode 随视角显隐） -->
    <nav class="sidenav" id="sidenav" aria-label="子系统导航">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1 3 9h4l-1 6 6-8H8z"/></svg>
        </div>
        <div class="brand-text">
          <b>OPC-OS 控制台</b>
          <span>Creative Monetization OS</span>
        </div>
      </div>

      <div class="nav-group">工作台</div>
      <a href="#/overview" data-route="overview" data-mode="both">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
        <span>总览</span>
      </a>
      <a href="#/ideas" data-route="ideas" data-mode="creator">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6a4.6 4.6 0 0 1 2.6 8.4c-.5.4-.8.9-.8 1.5v.7H6.2v-.7c0-.6-.3-1.1-.8-1.5A4.6 4.6 0 0 1 8 1.6z"/><path d="M6.4 14h3.2M7 15.4h2"/></svg>
        <span>我的创意</span>
      </a>
      <!-- 创意详情独立页（#/idea?id=）：路由注册所需，侧栏不展示 -->
      <a href="#/idea" data-route="idea" data-mode="creator" class="nav-ghost-link" tabindex="-1" aria-hidden="true">
        <span>创意详情</span>
      </a>
      <a href="#/content" data-route="content" data-mode="creator">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.1 2.4l2.5 2.5-7.3 7.3-3.3.8.8-3.3z"/><path d="M9.6 3.9l2.5 2.5"/><path d="M3.5 13.7h9"/></svg>
        <span>内容引擎</span>
      </a>
      <a href="#/memory" data-route="memory" data-mode="creator">
        <svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="3.8" rx="5" ry="2"/><path d="M3 3.8v8.4c0 1.1 2.2 2 5 2s5-.9 5-2V3.8"/><path d="M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/></svg>
        <span>创意资产</span>
      </a>

      <div class="nav-group">协作</div>
      <a href="#/team" data-route="team" data-mode="creator">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="5.5" cy="5" r="2.2"/><path d="M1.8 13.5c.6-2.3 2-3.4 3.7-3.4s3.1 1.1 3.7 3.4"/><circle cx="11" cy="6" r="1.8"/><path d="M11 9.6c1.6 0 2.7 1 3.3 2.9"/><path d="M8 1 9.2 3.4 8 5.8 6.8 3.4z" fill="currentColor" stroke="none"/></svg>
        <span>AI 组队</span>
      </a>
      <a href="#/board" data-route="board" data-mode="creator">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="4.6" height="11" rx="1"/><rect x="9" y="2.5" width="4.6" height="7" rx="1"/><path d="M4 5.2h1.6M4 7.4h1.6M10.8 5.2h1.4"/></svg>
        <span>任务板</span>
      </a>
      <a href="#/teams" data-route="teams" data-mode="ops">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="5.5" cy="5" r="2.2"/><path d="M1.8 13.5c.6-2.3 2-3.4 3.7-3.4s3.1 1.1 3.7 3.4"/><circle cx="11" cy="6" r="1.8"/><path d="M11 9.6c1.6 0 2.7 1 3.3 2.9"/></svg>
        <span>协作团队</span>
      </a>
      <a href="#/blackboard" data-route="blackboard" data-mode="ops">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="8.5" rx="1"/><path d="M4.5 5.5h5M4.5 8h7"/><path d="M8 11v2.2M5.5 14h5"/></svg>
        <span>黑板</span>
      </a>

      <div class="nav-group">增长</div>
      <a href="#/market" data-route="market" data-mode="both">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6.5 3.2 2.5h9.6L14 6.5M2 6.5h12M2 6.5V13a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6.5"/><path d="M5.5 8.5v3M8 8.5v3M10.5 8.5v3"/></svg>
        <span>创意市场</span>
      </a>
      <a href="#/skills" data-route="skills" data-mode="both">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8 13.5 4.5v7L8 14.2 2.5 11.5v-7z"/><path d="M2.5 4.5 8 7.3l5.5-2.8M8 7.3v6.9"/></svg>
        <span>Skill 市场</span>
      </a>

      <div class="nav-group">经营</div>
      <a href="#/creators" data-route="creators" data-mode="creator">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="5.3" r="2.4"/><path d="M1.8 13.8c.7-2.7 2.3-4 4.2-4 1 0 1.9.4 2.6 1.1"/><circle cx="11.6" cy="11.4" r="2.6"/><path d="M11.6 10.3v2.2M10.5 11.4h2.2"/></svg>
        <span>我的收入</span>
      </a>
      <a href="#/orders" data-route="orders" data-mode="ops">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h8v12l-2-1.2L8 14l-2-1.2L4 14z"/><path d="M6 5.5h4M6 8h4"/></svg>
        <span>订单交易</span>
      </a>
      <a href="#/bills" data-route="bills" data-mode="ops">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2" width="11" height="12" rx="1.2"/><path d="M5 5.5h6M5 8h6M5 10.5h3.5"/></svg>
        <span>客户账单</span>
      </a>
      <a href="#/billing" data-route="billing" data-mode="ops">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6 4.6 8 7.3l2-2.7M8 7.3v4.3M6.2 8.6h3.6M6.2 10.4h3.6"/></svg>
        <span>RaaS 计费</span>
      </a>

      <div class="nav-group">系统</div>
      <a href="#/account" data-route="account" data-mode="both">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8"/><path d="M2.5 14c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5"/></svg>
        <span>账户</span>
      </a>

      <!-- 侧栏底部用户区（app.js 只改 textContent / hidden，位置无关） -->
      <div class="rail-foot">
        <div class="av" id="user-av" aria-hidden="true">O</div>
        <span id="user-badge" class="who hidden"></span>
        <button id="logout-btn" class="btn btn-sm rail-logout hidden" type="button">退出</button>
      </div>
    </nav>

    <!-- 白色主列：顶栏（面包屑 + 视角切换 + ⌘K 搜索 + 状态） + 面板 + 运行时信息 -->
    <div class="main-col">
      <header class="topbar">
        <div class="crumb"><span class="ep" id="crumb-g">工作台</span><span class="slash">/</span><b id="crumb-t">总览</b></div>
        <div class="topbar-spacer"></div>
        <div class="modeselect" role="group" aria-label="切换视角">
          <button type="button" data-mode="creator">创作者</button>
          <button type="button" data-mode="ops">运营后台</button>
        </div>
        <button class="searchbtn" id="search-open" type="button" aria-label="全局搜索">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg>
          <span>搜索：创意 / 记忆 / Skill…</span><kbd>⌘K</kbd>
        </button>
        <span id="status-badge" class="badge badge-muted">连接中…</span>
      </header>
      <main id="main" class="main"></main>
      <footer class="footer" id="footer">运行时信息加载中…</footer>
    </div>
  </div>

  <!-- 右侧抽屉（快速详情：创意/记忆/Skill/订单），scrim 点击关闭 -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="dr-h">
      <div class="dr-heading">
        <div class="slabel" id="drawer-kind">—</div>
        <h2 id="drawer-title">—</h2>
      </div>
      <button class="iconbtn" id="drawer-close" type="button" aria-label="关闭抽屉">✕</button>
    </div>
    <div class="dr-b" id="drawer-body"></div>
    <div class="dr-f" id="drawer-foot"></div>
  </aside>

  <!-- 命令面板（⌘K：页面导航 + 跨创意/记忆/Skill 检索，键盘 ↑↓ Enter） -->
  <div class="palette" id="palette">
    <div class="box">
      <input id="palette-input" placeholder="搜索：页面 / 创意 / 记忆 / Skill…" aria-label="全局搜索">
      <div class="res" id="palette-res"></div>
    </div>
  </div>

  <!-- 全局 toast 容器 -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
